<!doctype html><html lang="de"><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
:root{--tinte:#14232A;--kalk:#F2F3EF;--see:#3FA9B5;--sonne:#FFB84A;--koralle:#F0765A;--rot:#C93B22}
body{background:#dfe5e6;color:var(--tinte);font-family:Archivo,sans-serif;position:relative}
svg.defs{position:absolute;width:0;height:0}
.welt{position:absolute;left:0;right:0;top:0;height:1000px;background-size:cover;background-position:center 30%;filter:saturate(1.08) brightness(1.06)}
.scheibe{position:absolute;top:0;height:996px;padding:86px 44px 0 52px;backdrop-filter:blur(26px) saturate(1.3);border-left:2px solid rgba(255,255,255,.8);border-right:1px solid rgba(255,255,255,.45);box-shadow:26px 0 50px -30px rgba(10,30,40,.55)}
.scheibe::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 70%,rgba(255,255,255,.2) 100%);pointer-events:none}
.klar{background:rgba(250,251,248,.80)}
.see{background:rgba(63,169,181,.62)}
.sonne{background:rgba(255,184,74,.68)}
.koralle{background:rgba(240,118,90,.62)}
.scheibe>*{position:relative}
.tag{font-size:23px;font-weight:500;color:#2B3D44}
h1{font-family:"Big Shoulders",sans-serif;font-weight:800;font-size:330px;line-height:.82;letter-spacing:-.01em;margin:10px 0 0 -6px}
h2{font-weight:650;font-stretch:108%;font-size:42px;line-height:1.08;letter-spacing:-.01em;margin-top:18px}
.scheibe p{font-size:22px;line-height:1.5;color:#263840;margin-top:16px;max-width:560px}
h3{font-size:19px;font-weight:750;margin:0 0 10px}
.block{margin-top:46px}.block:first-child{margin-top:0}
.linie{border-top:3px solid var(--tinte);padding-top:16px;margin-top:40px}
.z{display:flex;gap:12px;font-size:21px;line-height:1.3;font-weight:520;padding:8px 0}
.z span:first-child{font-variant-numeric:tabular-nums;min-width:64px}
.z small{margin-left:auto;font-size:19px;font-weight:750;white-space:nowrap}
.z a{margin-left:auto;font-size:18px;font-weight:750;color:#0F5B66}
.z i{flex:none;width:11px;height:11px;border-radius:50%;background:var(--sonne);margin:9px 4px 0 0;box-shadow:0 0 0 1px rgba(0,0,0,.2)}.z i.r{background:var(--rot)}
.jetzt{font-weight:800}.plus{color:#0B5A32}.minus{color:#A32412}
.schiene{position:absolute;left:0;right:0;top:994px;height:8px;background:#1A2A30;z-index:6}
.boden{position:absolute;left:0;right:0;top:1002px;bottom:0;background:var(--kalk);display:flex;align-items:center;padding:0 44px 0 132px;gap:42px;font-size:21px;font-weight:500;color:#586A71;z-index:6}
.boden .marke{font-family:"Big Shoulders",sans-serif;font-weight:800;font-size:34px;color:var(--tinte);letter-spacing:.02em;margin-right:8px}
.boden b{color:var(--tinte);font-weight:750;box-shadow:0 -31px 0 -26px var(--tinte)}
.boden .feld{margin-left:auto;display:flex;align-items:center;gap:14px;height:50px;padding:0 26px 0 18px;border-radius:25px;background:var(--tinte);color:#DDE6E8;font-size:19px}
.boden .feld i{width:13px;height:13px;border-radius:50%;background:var(--sonne);box-shadow:0 0 0 6px rgba(255,184,74,.25)}
.probe{position:absolute;right:44px;top:30px;font-size:17px;font-weight:600;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55);z-index:7}
.name{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:"Big Shoulders",sans-serif;font-weight:800;font-size:380px;line-height:1;color:#fff;text-shadow:0 10px 60px rgba(10,30,40,.35);display:none;z-index:3}
.f2 .scheibe{filter:url(#wisch)}.f2 .scheibe>*{opacity:.3}.f2 .probe,.f3 .probe{display:none}
.f3 .name{display:block}.f3 .scheibe>*{opacity:0}
</style>
<body class="f1"><script>document.body.className="f"+(new URLSearchParams(location.search).get("f")||1)</script>
<svg class="defs"><filter id="wisch" x="-10%" width="120%"><feGaussianBlur stdDeviation="18 0"/></filter></svg>
<div class="welt"></div><div class="name">Projekte</div><div id="glas"></div>
<div class="probe">Beispieldaten, 11:40 Uhr</div>
<div class="schiene"></div><div class="boden"></div>
<script>
const f=document.body.className, neu=f==="f3"||f==="f4";
const W=document.querySelector(".welt"); W.style.backgroundImage=`url(../../public/welt/${neu?"post":"dokumente"}.webp)`; if(neu) W.style.backgroundPosition="center 36%";
const akt=f==="f1"?"Heute":f==="f4"?"Projekte":"";
document.querySelector(".boden").innerHTML=`<span class="marke">JARVIS</span>`+["Heute","Projekte","Firma","Märkte","Agenten"].map(x=>x===akt?`<b>${x}</b>`:`<span>${x}</span>`).join("")+`<div class="feld"><i></i>Sag „Jarvis“ oder schreib hier</div>`;
const A=`<div class="tag">Freitag, 13. November. Als Nächstes:</div><h1>14:00</h1><h2>Besprechung Hallenneubau</h2><p>Die Unterlagen vom Statiker und das Angebot für den Stahlbau liegen bereit. Drei Punkte sind noch offen.</p><div class="linie"><h3>Wartet auf dein Ja</h3><div class="z"><i></i>Termin mit dem Steuerberater bestätigen<a>Ansehen</a></div><div class="z"><i></i>Antwort an die Bauleitung senden<a>Ansehen</a></div><div class="z"><i class="r"></i>Eine Aufgabe ist seit gestern überfällig<a>Ansehen</a></div></div>`;
const B=`<div class="block"><h3>Termine heute</h3><div class="z"><span>09:00</span>Bauleitung</div><div class="z jetzt"><span>14:00</span>Hallenneubau</div><div class="z"><span>16:30</span>Steuerberater</div></div><div class="block"><h3>Projekte</h3><div class="z">Hallenneubau<small>3 Tage</small></div><div class="z">KI-Dashboard<small>läuft</small></div><div class="z">Lagerumbau<small>geplant</small></div></div>`;
const C=`<div class="block"><h3>Märkte</h3><div class="z">Gold<small class="plus">+0,8 %</small></div><div class="z">Bitcoin<small class="minus">−1,2 %</small></div><div class="z">Spielgeld-Desk<small class="plus">+2,4 %</small></div></div><div class="block"><h3>Agenten</h3><div class="z">Marktbeobachter<small>läuft</small></div><div class="z">Postsortierer<small>fertig</small></div><div class="z">Morgenbericht<small>07:00</small></div></div>`;
const P1=`<div class="tag">Projekte. Am dringendsten:</div><h1 style="font-size:172px;line-height:.9;margin-left:-3px">Hallenneubau</h1><h2>Frist in 3 Tagen</h2><p>Der Bauantrag ist eingereicht. Das Angebot für den Stahlbau fehlt noch, die Statik ist in Prüfung.</p><div class="linie"><h3>Nächste Schritte</h3><div class="z"><i class="r"></i>Angebot Stahlbau nachfassen<a>bis Montag</a></div><div class="z"><i></i>Statik freigeben<a>bis Dienstag</a></div><div class="z"><i></i>Besprechung heute um 14:00<a>Vorbereitet</a></div></div>`;
const P2=`<div class="block"><h3>Alle Projekte</h3><div class="z jetzt">Hallenneubau<small>3 Tage</small></div><div class="z">KI-Dashboard<small>läuft</small></div><div class="z">Lagerumbau<small>geplant</small></div></div><div class="block"><h3>Zuletzt</h3><div class="z">Statiker hat geantwortet</div><div class="z">Plan Stand C abgelegt</div></div>`;
const P3=`<div class="block"><h3>Was Jarvis dazu weiß</h3><div class="z">12 Notizen</div><div class="z">7 Dateien</div><div class="z">4 Entscheidungen</div></div>`;
const S={
 f1:[["see",770,384,B],["sonne",1122,366,C],["klar",80,700,A]],
 f2:[["see",420,400,B],["sonne",640,372,C],["klar",-240,700,A],["koralle",1500,380,""],["klar",1700,400,""]],
 f3:[["see",-150,400,""],["sonne",40,372,""],["koralle",1560,360,""],["klar",1700,300,""]],
 f4:[["koralle",440,404,P2],["see",96,376,P3],["klar",800,900,P1]]}[f];
document.getElementById("glas").innerHTML=S.map(([art,x,w,h])=>`<div class="scheibe ${art}" style="left:${x}px;width:${w}px">${h}</div>`).join("");
</script>
</body></html>
