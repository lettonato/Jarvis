<!doctype html><html lang="de"><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
body{background:#111417;color:#F2F3F2;font-family:Manrope,sans-serif;padding:54px 72px 0}
h1{font-size:40px;font-weight:600;letter-spacing:-.01em}
.lead{font-size:23px;line-height:1.45;color:#B9C2C8;margin-top:10px;max-width:1500px}
.raster{display:grid;grid-template-columns:repeat(2,680px);gap:20px 180px;margin-top:28px;justify-content:center;position:relative}
.bild{width:680px;height:382px;overflow:hidden;position:relative;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.bild iframe{width:1920px;height:1080px;border:0;transform:scale(.3542);transform-origin:0 0}
.text{font-size:20px;line-height:1.4;margin-top:9px;color:#DDE2E5;height:30px}.text b{font-weight:700;color:#fff;margin-right:10px}
.pfeil{position:absolute;font-size:23px;color:#8E9AA1;width:180px;text-align:center;left:50%;margin-left:-90px}
</style>
<body><script>
const d=new URLSearchParams(location.search).get("d")||"a";
const T={a:["Richtung A „Premiere“: so wechselt JARVIS von „Heute“ zu „Märkte“","Jeder Bereich ist eine Filmszene. Beim Wechsel fährt die Kamera ins Bild, die schwarzen Balken schließen sich, eine Titelkarte nennt den nächsten Bereich, dann öffnet sich die neue Szene. Das dauert etwa eine Sekunde.",["Szene „Heute“ steht","Kamera fährt hinein, Schärfe wandert, Balken schließen","Titelkarte auf Schwarz","Szene „Märkte“ öffnet sich mit neuem Licht"]],
b:["Richtung B „Glashaus“: so wechselt JARVIS von „Heute“ zu „Projekte“","Jeder Bereich ist ein heller Raum mit eigenem Ausblick. Beim Wechsel fährt die Kamera seitlich durch die Wand in den nächsten Raum, der Raumname steht groß auf der Wand. Die Leiste unten bleibt ruhig stehen.",["Raum „Heute“","Kamera fährt seitlich los, Bewegungsunschärfe","Die Wand mit dem Raumnamen zieht vorbei","Raum „Projekte“ mit neuem Ausblick"]],
d:["Variante „Terrasse“: so wechselt JARVIS von „Heute“ zu „Projekte“","Du stehst im Freien, das Foto füllt das ganze Bild. Der Inhalt steht auf dem gläsernen Geländer, der Handlauf ist die Leiste. Beim Wechsel schwenkt der Blick wie eine Kopfdrehung zur nächsten Aussicht.",["Aussicht „Heute“","Der Blick schwenkt, das Geländer bleibt stehen","Die neue Aussicht kommt zur Ruhe, ihr Name steht im Himmel","Aussicht „Projekte“"]],
e:["Variante „Lichtspiel“: so wechselt JARVIS von „Heute“ zu „Projekte“","Eine ruhige Wand, auf die Sonnenlicht durch ein Fenster fällt. Die Lichtfelder sind die Ordnung für den Inhalt. Beim Wechsel wandert das Licht über die Wand. Über den Tag ändert es Winkel und Farbe, abends wird es golden.",["Wand „Heute“ im Mittagslicht","Das Licht wandert, der Inhalt fällt in den Schatten","Ein Lichtstreifen nennt den nächsten Bereich","Wand „Projekte“, das Licht fällt neu"]],
g:["Variante „Farbglas“: so wechselt JARVIS von „Heute“ zu „Projekte“","Raumhohe Schiebetüren aus farbigem Glas vor der Aussicht. Jede Scheibe trägt einen Teil des Inhalts, wo sie sich überlappen, mischen sich die Farben. Beim Wechsel gleiten die Scheiben auf ihrer Schiene zur Seite.",["Scheiben „Heute“","Die Scheiben gleiten zur Seite, neue kommen herein","Freier Blick, der nächste Bereich steht im Bild","Scheiben „Projekte“ in neuer Ordnung"]],
c:["Richtung C „Horizont“: eine Welt, die mit der Tageszeit geht","Es gibt nur eine durchgehende Landschaft. Der Tag ist ein Sonnenbogen mit deinen Terminen, die leuchtende Kugel ist JARVIS. Beim Wechsel schwenkt die Kamera den Horizont entlang. Abends ist dieselbe Welt in der Dämmerung.",["„Heute“ am Morgen, die Kugel steht bei 07:40","Schwenk den Horizont entlang","„Märkte“: der Bergkamm ist der Goldpreis","Dieselbe Ansicht am Abend um 18:50"]]}[d];
document.write(`<h1>${T[0]}</h1><p class="lead">${T[1]}</p><div class="raster">`+T[2].map((t,i)=>`<div><div class="bild"><iframe src="${d}.html?f=${i+1}"></iframe></div><div class="text"><b>${i+1}</b>${t}</div></div>`).join("")+`<div class="pfeil" style="top:175px">weiter</div><div class="pfeil" style="top:616px">weiter</div></div>`);
</script></body></html>
